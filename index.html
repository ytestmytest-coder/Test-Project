<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Past Present Future Reveal</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{
min-height:100vh;display:flex;justify-content:center;align-items:center;
background:linear-gradient(135deg,#0f172a,#312e81);
padding:20px;
}
.container{text-align:center}
h1{color:#fff;margin-bottom:10px;font-size:3rem}
.subtitle{color:#ddd;margin-bottom:25px}
.card{
position:relative;width:700px;max-width:95vw;height:430px;
border-radius:24px;overflow:hidden;
box-shadow:0 20px 60px rgba(0,0,0,.4);
}
.reveal{
width:100%;height:100%;
display:flex;flex-direction:column;justify-content:center;align-items:center;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
color:white;
}
.reveal img{
width:220px;height:220px;border-radius:50%;
object-fit:cover;border:8px solid white;margin-bottom:20px;
}
canvas{position:absolute;inset:0;cursor:pointer}
.fake{
position:absolute;inset:0;display:flex;flex-direction:column;
justify-content:center;align-items:center;
background:#111827;color:white;z-index:5;
animation:shake .6s;
}
.fake h2{font-size:3rem}
.fake p{margin-top:10px;font-size:1.2rem}
@keyframes shake{
0%,100%{transform:translateX(0)}
20%{transform:translateX(-10px)}
40%{transform:translateX(10px)}
60%{transform:translateX(-10px)}
80%{transform:translateX(10px)}
}

.container{
width:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.card{
margin:0 auto;
}

@media (max-width:768px){
h1{font-size:2rem;padding:0 10px;}
.subtitle{padding:0 15px;}
.card{
width:92vw;
height:60vh;
min-height:340px;
max-height:500px;
}
.reveal img{
width:140px;
height:140px;
}
.fake h2{
font-size:2rem;
text-align:center;
padding:0 10px;
}
}
</style>
</head>
<body>
<div class="container">
<h1>🔮 Want To See My Past, Present & Future?</h1>
<div class="subtitle">Scratch the card to reveal the secret ✨</div>

<div class="card" id="card">
<div class="reveal">
<img src="her.jpg" alt="Replace with your image">
<h2>🎉 IT'S HER ❤️</h2>
<p>Past ➜ Her ❤️<br>Present ➜ Her ❤️<br>Future ➜ Her ❤️</p>
</div>
<canvas id="canvas"></canvas>
</div>
</div>

<script>
const canvas=document.getElementById('canvas');
const card=document.getElementById('card');
const ctx=canvas.getContext('2d');

canvas.width=card.clientWidth;
canvas.height=card.clientHeight;

let stage=1;
let done=false;
let drawing=false;

function drawLayer(text){
ctx.globalCompositeOperation='source-over';
let g=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
g.addColorStop(0,'#FFD700');
g.addColorStop(.5,'#F4C430');
g.addColorStop(1,'#B8860B');
ctx.fillStyle=g;
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle='white';
ctx.textAlign='center';
ctx.font='bold 42px Arial';
ctx.fillText(text,canvas.width/2,canvas.height/2);
}

drawLayer('Scratch Me ✨');

function scratch(x,y){
ctx.globalCompositeOperation='destination-out';
ctx.beginPath();
ctx.arc(x,y,30,0,Math.PI*2);
ctx.fill();
check();
}

function percentRevealed(){
const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
let t=0;
for(let i=3;i<data.length;i+=4){
if(data[i]===0)t++;
}
return t/(data.length/4);
}

function fake(title,msg,nextText){
canvas.style.display='none';
const div=document.createElement('div');
div.className='fake';
div.innerHTML=`<h2>${title}</h2><p>${msg}</p>`;
card.appendChild(div);

setTimeout(()=>{
div.remove();
canvas.style.display='block';
drawLayer(nextText);
},2200);
}

function check(){
if(percentRevealed()<0.35 || done) return;

if(stage===1){
stage=2;
fake('❌ Not Her','Try Again 😏','Scratch Again ✨');
}
else if(stage===2){
stage=3;
fake('❌ Still Not Her','One Last Chance 😂','Final Attempt 🔥');
}
else{
done=true;
canvas.style.display='none';

confetti({particleCount:250,spread:120,origin:{y:0.6}});
setTimeout(()=>confetti({particleCount:300,spread:180}),400);
setTimeout(()=>confetti({particleCount:400,spread:250}),800);
}
}

canvas.addEventListener('mousedown',()=>drawing=true);
canvas.addEventListener('mouseup',()=>drawing=false);
canvas.addEventListener('mousemove',e=>{
if(!drawing)return;
const r=canvas.getBoundingClientRect();
scratch(e.clientX-r.left,e.clientY-r.top);
});

canvas.addEventListener('touchstart',()=>drawing=true);
canvas.addEventListener('touchend',()=>drawing=false);
canvas.addEventListener('touchmove',e=>{
if(!drawing)return;
const r=canvas.getBoundingClientRect();
const t=e.touches[0];
scratch(t.clientX-r.left,t.clientY-r.top);
});
</script>
</body>
</html>
