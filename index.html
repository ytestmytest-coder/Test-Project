<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Really Sorry ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        -45deg,
        #ff5f9e,
        #ff7eb3,
        #ff9a9e,
        #ffc3a0,
        #ffd1ff
    );
    background-size:400% 400%;
    animation:gradient 12s ease infinite;
}

@keyframes gradient{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    width:90%;
    max-width:650px;
    padding:45px;
    text-align:center;
    border-radius:35px;
    backdrop-filter:blur(25px);
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.3);
    box-shadow:0 25px 60px rgba(0,0,0,.2);
    animation:floatCard 4s ease-in-out infinite;
    z-index:100;
}

@keyframes floatCard{
    0%,100%{transform:translateY(0px);}
    50%{transform:translateY(-15px);}
}

.title{
    font-size:4rem;
    color:white;
    text-shadow:0 0 25px rgba(255,255,255,.9);
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.08);}
}

.message{
    color:white;
    margin-top:20px;
    min-height:90px;
    line-height:1.8;
    font-size:1.2rem;
}

.buttons{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

button{
    border:none;
    cursor:pointer;
    padding:15px 28px;
    border-radius:50px;
    font-size:18px;
    font-weight:700;
    transition:.3s;
}

#forgiveBtn{
    background:white;
    color:#ff4f7b;
}

#forgiveBtn:hover{
    transform:scale(1.1);
}

#noBtn{
    background:#ff4f7b;
    color:white;
    position:relative;
}

.result{
    margin-top:25px;
    color:white;
    font-size:32px;
    font-weight:bold;
}

.heart{
    position:absolute;
    color:white;
    opacity:.7;
    animation:floatUp linear infinite;
    pointer-events:none;
}

@keyframes floatUp{
    from{
        transform:translateY(100vh) scale(.5);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    to{
        transform:translateY(-100px) scale(1.5);
        opacity:0;
    }
}

@keyframes rainbow{
    from{
        filter:hue-rotate(0deg);
    }
    to{
        filter:hue-rotate(360deg);
    }
}

@keyframes explodeHeart{
    from{
        transform:translate(-50%,-50%) scale(0);
        opacity:1;
    }
    to{
        transform:translate(-50%,-50%) scale(4);
        opacity:0;
    }
}

.explode{
    position:fixed;
    font-size:40px;
    pointer-events:none;
    animation:explodeHeart 1.5s forwards;
}

.success{
    animation:rainbow 3s linear infinite;
}

@media(max-width:600px){
    .title{
        font-size:2.7rem;
    }

    .message{
        font-size:1rem;
    }

    .card{
        padding:30px;
    }
}

</style>
</head>
<body>

<div class="card" id="card">

    <h1 class="title">🥺 Sorry ❤️</h1>

    <div class="message" id="typing"></div>

    <div class="buttons">
        <button id="forgiveBtn">
            🥰 Forgive Me
        </button>

        <button id="noBtn">
            😤 I Will Not Forgive
        </button>
    </div>

    <div class="result" id="result"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script>

// Typewriter

const text =
"I never wanted to hurt you. Every moment feels incomplete without your smile. Please give me one chance to make things right. ❤️";

let i = 0;

function typeWriter(){
    if(i < text.length){
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter,40);
    }
}

typeWriter();

// Floating hearts

for(let i=0;i<40;i++){

    const heart=document.createElement("div");

    heart.className="heart";
    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(15+Math.random()*25)+"px";
    heart.style.animationDuration=(5+Math.random()*8)+"s";
    heart.style.animationDelay=Math.random()*5+"s";

    document.body.appendChild(heart);
}

// Escaping button

const noBtn=document.getElementById("noBtn");

const messages=[
"🥺 Please forgive",
"❤️ Pretty please",
"😭 One more chance",
"🌹 Virtual flowers",
"🥹 I promise",
"💖 Pleaseeeee",
"😇 I am sorry",
"🥺 Forgive me?"
];

let msgIndex=0;

function moveButton(){

    const maxX=window.innerWidth-220;
    const maxY=window.innerHeight-120;

    noBtn.style.position="fixed";
    noBtn.style.left=Math.random()*maxX+"px";
    noBtn.style.top=Math.random()*maxY+"px";

    noBtn.innerHTML=messages[msgIndex];

    msgIndex++;

    if(msgIndex>=messages.length){
        msgIndex=0;
    }
}

noBtn.addEventListener("mouseover",moveButton);
noBtn.addEventListener("click",moveButton);

// Forgive button

document.getElementById("forgiveBtn")
.addEventListener("click",()=>{

    document.body.classList.add("success");

    document.getElementById("result").innerHTML=
    "🎉 YAYYYYY!! THANK YOU ❤️";

    // Massive confetti

    const duration=6000;
    const end=Date.now()+duration;

    (function frame(){

        confetti({
            particleCount:10,
            angle:60,
            spread:120,
            origin:{x:0}
        });

        confetti({
            particleCount:10,
            angle:120,
            spread:120,
            origin:{x:1}
        });

        if(Date.now()<end){
            requestAnimationFrame(frame);
        }

    })();

    confetti({
        particleCount:400,
        spread:360,
        startVelocity:50
    });

    // Heart explosion

    for(let i=0;i<30;i++){

        const h=document.createElement("div");

        h.className="explode";
        h.innerHTML="❤️";

        h.style.left=(window.innerWidth/2+
        (Math.random()*400-200))+"px";

        h.style.top=(window.innerHeight/2+
        (Math.random()*300-150))+"px";

        document.body.appendChild(h);

        setTimeout(()=>{
            h.remove();
        },1500);
    }

    // Final screen

    setTimeout(()=>{

        document.getElementById("card").innerHTML=`

        <h1 style="
        color:white;
        font-size:4rem;
        text-shadow:0 0 20px white;
        ">
        🎉 APOLOGY ACCEPTED 🎉
        </h1>

        <h2 style="
        color:white;
        margin-top:20px;
        ">
        ❤️ Thank You ❤️
        </h2>

        <p style="
        color:white;
        margin-top:20px;
        font-size:1.2rem;
        ">
        You are officially the sweetest person alive 🥹
        </p>

        <div style="
        font-size:90px;
        margin-top:25px;
        animation:pulse 1.5s infinite;
        ">
        🥰💖🎊🌹✨
        </div>

        `;

    },2500);

});

</script>

</body>
</html>
