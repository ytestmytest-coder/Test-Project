<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#ff758c,#ff7eb3,#ff9a9e,#ffd6e0);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    width:90%;
    max-width:650px;
    padding:40px;
    border-radius:30px;
    text-align:center;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.3);
    box-shadow:0 20px 50px rgba(0,0,0,.15);
    animation:float 4s ease-in-out infinite;
    z-index:10;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
}

h1{
    color:white;
    font-size:4rem;
    text-shadow:0 0 20px rgba(255,255,255,.7);
}

.message{
    color:white;
    margin-top:20px;
    line-height:1.8;
    min-height:90px;
    font-size:1.15rem;
}

.buttons{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

button{
    border:none;
    border-radius:50px;
    padding:15px 28px;
    cursor:pointer;
    font-size:17px;
    font-weight:600;
    transition:.3s;
}

#forgiveBtn{
    background:white;
    color:#ff4f7b;
}

#forgiveBtn:hover{
    transform:scale(1.08);
}

#noBtn{
    background:#ff4f7b;
    color:white;
    position:relative;
}

.heart{
    position:absolute;
    color:white;
    animation:rise linear infinite;
    opacity:.7;
    pointer-events:none;
}

@keyframes rise{
    from{
        transform:translateY(100vh);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    to{
        transform:translateY(-100px);
        opacity:0;
    }
}

.fade{
    animation:fadeIn 1s ease forwards;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.bigHeart{
    font-size:100px;
    animation:heartbeat 1.8s infinite;
}

@keyframes heartbeat{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.15);
    }
}
</style>
</head>

<body>

<div class="card" id="card">

    <h1>🥺 Sorry</h1>

    <div class="message" id="typing"></div>

    <div class="buttons">
        <button id="forgiveBtn">🥰 Forgive Me</button>
        <button id="noBtn">😤 I Will Not Forgive</button>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script>

// Typewriter

const text =
"I know I made a mistake. I truly regret it and I hope you can find it in your heart to forgive me. ❤️";

let i=0;

function typeWriter(){
    if(i<text.length){
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter,40);
    }
}

typeWriter();


// Floating hearts

for(let i=0;i<35;i++){

    let heart=document.createElement("div");

    heart.className="heart";
    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(15+Math.random()*20)+"px";
    heart.style.animationDuration=(5+Math.random()*8)+"s";
    heart.style.animationDelay=Math.random()*5+"s";

    document.body.appendChild(heart);
}


// Escaping No button

const noBtn=document.getElementById("noBtn");

const messages=[
"🥺 Please forgive",
"❤️ Pretty please",
"😭 One more chance",
"🌹 Flowers for you",
"🥹 I'm really sorry",
"💖 Pleaseeeee",
"😇 I promise",
"🥺 Forgive me?"
];

let index=0;

function moveButton(){

    const maxX=window.innerWidth-220;
    const maxY=window.innerHeight-100;

    noBtn.style.position="fixed";
    noBtn.style.left=Math.random()*maxX+"px";
    noBtn.style.top=Math.random()*maxY+"px";

    noBtn.innerHTML=messages[index];

    index++;

    if(index>=messages.length){
        index=0;
    }
}

noBtn.addEventListener("mouseover",moveButton);
noBtn.addEventListener("click",moveButton);


// Forgive button

document.getElementById("forgiveBtn")
.addEventListener("click",()=>{

    confetti({
        particleCount:100,
        spread:70,
        origin:{y:0.7}
    });

    document.getElementById("card").innerHTML=`

        <div class="fade">

            <div class="bigHeart">❤️</div>

            <h1 style="font-size:3rem;margin-top:10px;">
                Thank You
            </h1>

            <p style="
                color:white;
                margin-top:20px;
                line-height:1.8;
                font-size:1.2rem;
            ">
                Your forgiveness means a lot to me.
                <br>
                Thank you for giving me another chance.
            </p>

            <div style="
                font-size:45px;
                margin-top:25px;
            ">
                🥰 🌹 💖
            </div>

        </div>

    `;
});

</script>

</body>
</html>
