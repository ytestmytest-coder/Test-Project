<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mobile Optimized Scratch Card</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:12px;
    background:linear-gradient(135deg,#0f172a,#312e81,#1e1b4b);
}

.container{
    width:100%;
    max-width:900px;
    text-align:center;
}

.title{
    color:#fff;
    font-size:clamp(1.5rem,6vw,3.5rem);
    margin-bottom:10px;
}

.subtitle{
    color:#d1d5db;
    margin-bottom:20px;
}

.card{
    position:relative;
    width:min(95vw,750px);
    height:min(70vh,500px);
    min-height:320px;
    margin:auto;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.reveal{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    color:white;
}

.reveal img{
    width:min(40vw,220px);
    height:min(40vw,220px);
    border-radius:50%;
    object-fit:cover;
    border:6px solid white;
    margin-bottom:15px;
}

.reveal h2{
    font-size:clamp(1.3rem,5vw,2rem);
    margin-bottom:10px;
}

.reveal p{
    font-size:clamp(1rem,3vw,1.2rem);
    line-height:1.8;
}

canvas{
    position:absolute;
    inset:0;
    touch-action:none;
}

.overlay{
    position:absolute;
    inset:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    background:#111827;
    color:white;
}

.overlay img{
    width:min(35vw,180px);
    height:min(35vw,180px);
    border-radius:50%;
    object-fit:cover;
    border:5px solid white;
    margin:15px 0;
}

@media(max-width:480px){
    .card{
        width:96vw;
        height:60vh;
    }
}
</style>
</head>

<body>

<div class="container">

<h1 class="title">🔮 Want To See My Past, Present & Future?</h1>

<div class="subtitle">
Scratch the card and find out...
</div>

<div class="card" id="card">

<div class="reveal">

<img id="finalImage" src="girl1.png">

<h2>🎉 IT'S HER ❤️</h2>

<p>
Past ➜ Her ❤️ <br>
Present ➜ Her ❤️ <br>
Future ➜ Her ❤️
</p>

</div>

<canvas id="canvas"></canvas>

</div>

</div>

<script>

const FIRST_IMAGE="girl1.png";
const SECOND_IMAGE="girl2.png";
const FINAL_IMAGE="her.jpg";

const card=document.getElementById("card");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let stage=1;
let done=false;
let scratching=false;
let stageLocked=false;
let scratchCount=0;

const MOBILE=window.innerWidth<768;

const SCRATCH_RADIUS=MOBILE?18:30;
const REQUIRED_SCRATCHES=MOBILE?120:80;
const REQUIRED_PERCENT=MOBILE?0.55:0.40;

function drawLayer(text){

    ctx.globalCompositeOperation="source-over";

    const g=ctx.createLinearGradient(
        0,0,canvas.width,canvas.height
    );

    g.addColorStop(0,"#FFD700");
    g.addColorStop(.5,"#F4C430");
    g.addColorStop(1,"#B8860B");

    ctx.fillStyle=g;
    ctx.fillRect(
        0,0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle="white";
    ctx.textAlign="center";
    ctx.font=`bold ${Math.max(24,canvas.width/15)}px Arial`;

    ctx.fillText(
        text,
        canvas.width/2,
        canvas.height/2
    );
}

function resizeCanvas(){

    canvas.width=card.clientWidth;
    canvas.height=card.clientHeight;

    if(!done){

        if(stage===1){
            drawLayer("Scratch Me ✨");
        }
        else if(stage===2){
            drawLayer("Scratch Again ✨");
        }
        else{
            drawLayer("Final Attempt 🔥");
        }
    }
}

resizeCanvas();
window.addEventListener("resize",resizeCanvas);

function scratch(x,y){

    ctx.globalCompositeOperation="destination-out";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        SCRATCH_RADIUS,
        0,
        Math.PI*2
    );

    ctx.fill();

    scratchCount++;

    checkReveal();
}

function revealedPercent(){

    const pixels=ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
    ).data;

    let transparent=0;

    for(let i=3;i<pixels.length;i+=4){

        if(pixels[i]===0){
            transparent++;
        }
    }

    return transparent/(pixels.length/4);
}

function checkReveal(){

    if(done||stageLocked){
        return;
    }

    if(scratchCount<REQUIRED_SCRATCHES){
        return;
    }

    if(revealedPercent()<REQUIRED_PERCENT){
        return;
    }

    stageLocked=true;

    if(stage===1){

        stage=2;

        showSequence(
            "❌ Not Her",
            FIRST_IMAGE,
            "Scratch Again ✨"
        );
    }
    else if(stage===2){

        stage=3;

        showSequence(
            "❌ Still Not Her",
            SECOND_IMAGE,
            "Final Attempt 🔥"
        );
    }
    else{

        done=true;

        finalReveal();
    }
}

function showSequence(
    title,
    image,
    nextText
){

    canvas.style.display="none";

    const overlay=document.createElement("div");

    overlay.className="overlay";

    overlay.innerHTML=`
        <h2>🔍 Analyzing...</h2>
        <p>Checking records...</p>
    `;

    card.appendChild(overlay);

    setTimeout(()=>{

        overlay.innerHTML=`
            <h2>${title}</h2>
            <img src="${image}">
            <p>Hmm... something seems off 🤔</p>
        `;

        setTimeout(()=>{

            overlay.remove();

            scratchCount=0;
            stageLocked=false;

            canvas.style.display="block";

            drawLayer(nextText);

        },2500);

    },2000);
}

function finalReveal(){

    canvas.style.display="none";

    const overlay=document.createElement("div");

    overlay.className="overlay";

    overlay.innerHTML=`
        <h2>❤️ Matching Soulmate Records...</h2>
        <p>Please wait...</p>
    `;

    card.appendChild(overlay);

    setTimeout(()=>{

        overlay.remove();

        document.getElementById(
            "finalImage"
        ).src=FINAL_IMAGE;

        confetti({
            particleCount:250,
            spread:120
        });

        setTimeout(()=>{
            confetti({
                particleCount:350,
                spread:180
            });
        },400);

    },3000);
}

canvas.addEventListener(
    "mousedown",
    ()=>scratching=true
);

canvas.addEventListener(
    "mouseup",
    ()=>scratching=false
);

canvas.addEventListener(
    "mouseleave",
    ()=>scratching=false
);

canvas.addEventListener(
    "mousemove",
    e=>{

        if(!scratching)return;

        const rect=canvas.getBoundingClientRect();

        scratch(
            e.clientX-rect.left,
            e.clientY-rect.top
        );
    }
);

canvas.addEventListener(
    "touchstart",
    e=>{
        e.preventDefault();
        scratching=true;
    },
    {passive:false}
);

canvas.addEventListener(
    "touchend",
    ()=>scratching=false,
    {passive:false}
);

canvas.addEventListener(
    "touchmove",
    e=>{

        e.preventDefault();

        if(!scratching)return;

        const rect=canvas.getBoundingClientRect();

        const touch=e.touches[0];

        scratch(
            touch.clientX-rect.left,
            touch.clientY-rect.top
        );

    },
    {passive:false}
);

</script>

</body>
</html>
